<!DOCTYPE html>
<html lang="de" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Getränkelager</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#09090b',       // Deep Dark Zinc 950
              card: '#18181b',     // Card Background Zinc 900
              border: '#27272a',   // Border Color Zinc 800
              sky: '#00bfff',      // Deep Sky Blue Accent
              skyHover: '#0099cc',
              amber: '#f59e0b',
              emerald: '#10b981',
              rose: '#f43f5e'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      user-select: none;
      -webkit-user-select: none;
    }
    input, button, select {
      touch-action: manipulation;
    }
  </style>
</head>
<body class="bg-brand-bg text-zinc-100 min-h-full font-sans antialiased flex flex-col justify-between">

  <!-- 1. PIN-LOCKSCREEN (6 PUNKTE) -->
  <div id="pin-screen" class="fixed inset-0 bg-brand-bg z-50 flex flex-col items-center justify-center p-6">
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-zinc-900 border border-zinc-800 flex items-center justify-center mx-auto mb-4 text-brand-sky shadow-lg shadow-sky-950/30">
        <i class="fa-solid fa-wine-bottle text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">Getränkelager</h1>
      <p class="text-sm text-zinc-400 mt-1">Bitte 6-stelligen PIN eingeben</p>
    </div>

    <!-- 6 PIN-DOTS -->
    <div id="pin-dots" class="flex gap-3 mb-8">
      <div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-zinc-700 bg-transparent transition-all duration-200"></div>
      <div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-zinc-700 bg-transparent transition-all duration-200"></div>
      <div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-zinc-700 bg-transparent transition-all duration-200"></div>
      <div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-zinc-700 bg-transparent transition-all duration-200"></div>
      <div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-zinc-700 bg-transparent transition-all duration-200"></div>
      <div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-zinc-700 bg-transparent transition-all duration-200"></div>
    </div>

    <!-- NUMPAD -->
    <div class="grid grid-cols-3 gap-4 w-full max-w-[280px]">
      <button onclick="pressPinDigit('1')" class="h-16 rounded-full bg-brand-card border border-brand-border text-2xl font-semibold active:bg-zinc-800 transition-colors">1</button>
      <button onclick="pressPinDigit('2')" class="h-16 rounded-full bg-brand-card border border-brand-border text-2xl font-semibold active:bg-zinc-800 transition-colors">2</button>
      <button onclick="pressPinDigit('3')" class="h-16 rounded-full bg-brand-card border border-brand-border text-2xl font-semibold active:bg-zinc-800 transition-colors">3</button>
      <button onclick="pressPinDigit('4')" class="h-16 rounded-full bg-brand-card border border-brand-border text-2xl font-semibold active:bg-zinc-800 transition-colors">4</button>
      <button onclick="pressPinDigit('5')" class="h-16 rounded-full bg-brand-card border border-brand-border text-2xl font-semibold active:bg-zinc-800 transition-colors">5</button>
      <button onclick="pressPinDigit('6')" class="h-16 rounded-full bg-brand-card border border-brand-border text-2xl font-semibold active:bg-zinc-800 transition-colors">6</button>
      <button onclick="pressPinDigit('7')" class="h-16 rounded-full bg-brand-card border border-brand-border text-2xl font-semibold active:bg-zinc-800 transition-colors">7</button>
      <button onclick="pressPinDigit('8')" class="h-16 rounded-full bg-brand-card border border-brand-border text-2xl font-semibold active:bg-zinc-800 transition-colors">8</button>
      <button onclick="pressPinDigit('9')" class="h-16 rounded-full bg-brand-card border border-brand-border text-2xl font-semibold active:bg-zinc-800 transition-colors">9</button>
      <button onclick="clearPin()" class="h-16 rounded-full bg-zinc-900 border border-brand-border text-zinc-400 active:bg-zinc-800 transition-colors flex items-center justify-center">
        <i class="fa-solid fa-rotate-left"></i>
      </button>
      <button onclick="pressPinDigit('0')" class="h-16 rounded-full bg-brand-card border border-brand-border text-2xl font-semibold active:bg-zinc-800 transition-colors">0</button>
      <button onclick="deletePinDigit()" class="h-16 rounded-full bg-zinc-900 border border-brand-border text-zinc-400 active:bg-zinc-800 transition-colors flex items-center justify-center">
        <i class="fa-solid fa-delete-left"></i>
      </button>
    </div>
    
    <div id="pin-error" class="text-brand-rose mt-4 text-sm font-medium hidden">Falscher PIN! Bitte erneut versuchen.</div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="app-container" class="hidden flex-1 max-w-sm mx-auto w-full p-4 flex flex-col pb-20">
    
    <!-- HEADER -->
    <header class="flex items-center justify-between py-3 mb-4 border-b border-brand-border">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-boxes-stacked text-brand-sky text-xl"></i>
        <h1 class="text-xl font-bold tracking-wide text-white">Getränkelager</h1>
      </div>
      <div class="flex items-center gap-2">
        <span id="sync-status" class="w-2.5 h-2.5 rounded-full bg-brand-amber animate-pulse" title="Synchronisiere..."></span>
        <button onclick="syncData()" class="p-2 text-zinc-400 hover:text-brand-sky transition-colors">
          <i class="fa-solid fa-arrows-rotate"></i>
        </button>
      </div>
    </header>

    <!-- NAVIGATION TABS -->
    <div class="grid grid-cols-2 bg-brand-card p-1 rounded-xl border border-brand-border mb-4">
      <button id="tab-inventory-btn" onclick="switchTab('inventory')" class="py-2 text-sm font-medium rounded-lg transition-all bg-brand-sky text-zinc-950 font-bold shadow-sm">
        <i class="fa-solid fa-boxes-packing mr-1.5"></i> Bestand
      </button>
      <button id="tab-quick-btn" onclick="switchTab('quick')" class="py-2 text-sm font-medium rounded-lg transition-all text-zinc-400 hover:text-white">
        <i class="fa-solid fa-right-left mr-1.5"></i> Buchen
      </button>
    </div>

    <!-- TAB 1: REINER BESTAND (KEINE Direct-Buttons) -->
    <div id="tab-inventory" class="space-y-4 flex-1">
      
      <!-- Dashboard Stats -->
      <div class="bg-gradient-to-r from-zinc-900 to-zinc-900/80 p-4 rounded-xl border border-brand-border flex items-center justify-between shadow-sm">
        <div>
          <p class="text-xs text-zinc-400 uppercase tracking-wider font-semibold">Gesamter Lagerbestand</p>
          <p id="total-liters" class="text-2xl font-extrabold text-brand-sky mt-0.5">0.00 <span class="text-sm font-normal text-zinc-400">Liter</span></p>
        </div>
        <div class="text-right">
          <p class="text-xs text-zinc-400 uppercase tracking-wider font-semibold">Flaschen/Dosen</p>
          <p id="total-items" class="text-xl font-bold text-white mt-0.5">0</p>
        </div>
      </div>

      <!-- Suche -->
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-500 text-sm"></i>
        <input type="text" id="search-input" oninput="renderInventory()" placeholder="Marke, Sorte oder EAN suchen..." class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-brand-card border border-brand-border text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-brand-sky transition-colors">
      </div>

      <!-- Bestandsliste (NUR ANZEIGE) -->
      <div id="inventory-list" class="space-y-2.5">
        <!-- Dynamische Befüllung -->
      </div>
    </div>

    <!-- TAB 2: BUCHEN (Eingang / Ausgang & Mengenauswahl) -->
    <div id="tab-quick" class="hidden space-y-4 flex-1">
      <div class="bg-brand-card p-4 rounded-xl border border-brand-border space-y-4">
        
        <div>
          <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">1. Getränk auswählen</label>
          <select id="quick-select" class="w-full bg-zinc-950 border border-brand-border rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-brand-sky transition-colors">
            <!-- Dynamische Befüllung -->
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">2. Menge wählen</label>
          <div class="flex items-center gap-2">
            <button onclick="setAmount(1)" class="px-3 py-2 bg-zinc-800 hover:bg-zinc-700 text-xs font-bold rounded-lg border border-brand-border">1</button>
            <button onclick="setAmount(2)" class="px-3 py-2 bg-zinc-800 hover:bg-zinc-700 text-xs font-bold rounded-lg border border-brand-border">2</button>
            <button onclick="setAmount(6)" class="px-3 py-2 bg-zinc-800 hover:bg-zinc-700 text-xs font-bold rounded-lg border border-brand-border">6 (Träger)</button>
            <button onclick="setAmount(20)" class="px-3 py-2 bg-zinc-800 hover:bg-zinc-700 text-xs font-bold rounded-lg border border-brand-border">20 (Kiste)</button>
          </div>
          <div class="mt-2">
            <input type="number" id="booking-amount" value="1" min="1" class="w-full bg-zinc-950 border border-brand-border rounded-xl p-2.5 text-center text-lg font-bold text-brand-sky focus:outline-none focus:border-brand-sky">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 pt-2">
          <button onclick="executeBooking(1)" class="py-3 bg-brand-sky text-zinc-950 font-bold rounded-xl active:bg-brand-skyHover transition-colors flex items-center justify-center gap-2 shadow-lg shadow-sky-950/20">
            <i class="fa-solid fa-plus text-lg"></i> Eingang
          </button>
          <button onclick="executeBooking(-1)" class="py-3 bg-zinc-800 text-brand-rose border border-zinc-700 font-bold rounded-xl active:bg-zinc-700 transition-colors flex items-center justify-center gap-2">
            <i class="fa-solid fa-minus text-lg"></i> Ausgang
          </button>
        </div>
      </div>

      <!-- NEUES GETRÄNK MIT EAN ANLEGEN -->
      <div class="bg-brand-card p-4 rounded-xl border border-brand-border space-y-3">
        <h3 class="text-sm font-semibold text-white flex items-center gap-2 border-b border-brand-border pb-2">
          <i class="fa-solid fa-barcode text-brand-sky"></i> Neues Getränk / EAN anlegen
        </h3>
        <div>
          <label class="block text-xs text-zinc-400 mb-1">EAN / Barcode (ID)</label>
          <input type="text" id="new-ean" placeholder="z. B. 4002343021205" class="w-full bg-zinc-950 border border-brand-border rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-brand-sky">
        </div>
        <div>
          <label class="block text-xs text-zinc-400 mb-1">Marke</label>
          <input type="text" id="new-brand" placeholder="z. B. Astra" class="w-full bg-zinc-950 border border-brand-border rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-brand-sky">
        </div>
        <div>
          <label class="block text-xs text-zinc-400 mb-1">Sorte</label>
          <input type="text" id="new-variety" placeholder="z. B. Rakete" class="w-full bg-zinc-950 border border-brand-border rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-brand-sky">
        </div>
        <div>
          <label class="block text-xs text-zinc-400 mb-1">Füllmenge (Liter)</label>
          <input type="number" step="0.01" id="new-volume" placeholder="z. B. 0.33" class="w-full bg-zinc-950 border border-brand-border rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-brand-sky">
        </div>
        <button onclick="addNewItem()" class="w-full py-2.5 bg-zinc-800 hover:bg-zinc-700 text-white font-medium text-sm rounded-lg border border-brand-border transition-colors mt-2">
          Hinzufügen
        </button>
      </div>
    </div>

  </div>

  <!-- JAVASCRIPT LOGIK -->
  <script>
    // -------------------------------------------------------------
    // CONFIGURATION (JSONBin.io)
    // Trage hier deine Keys ein:
    // -------------------------------------------------------------
    let CONFIG_BIN_ID = "6ad890beac6210605a4541a5";
    let CONFIG_MASTER_KEY = "$2a$10$.mIeRoeBg89gaf9lEZn0vuOSzzGr4se/Z98CNP0ANIP2zCRkZzTkG";

    // 6-stelliger PIN
    const PIN_CODE = "123456";
    let currentPinInput = "";
    let inventoryData = {};

    // Robustes Daten-Parsing
    function parseItem(item) {
      if (!item || typeof item !== 'object') {
        return { brand: 'Unbekannt', variety: 'Standard', volume: 0, stock: 0 };
      }
      return {
        brand: item.brand || item.Brand || 'Unbekannt',
        variety: item.sort || item.variety || item.Sort || item.Variety || 'Standard',
        volume: parseFloat(item.volume !== undefined ? item.volume : item.Volume) || 0,
        stock: parseInt(item.stock !== undefined ? item.stock : (item.quantity !== undefined ? item.quantity : item.Stock)) || 0
      };
    }

    // PIN Handlers
    function pressPinDigit(digit) {
      if (currentPinInput.length < 6) {
        currentPinInput += digit;
        updatePinDots();
        if (currentPinInput.length === 6) {
          setTimeout(checkPin, 200);
        }
      }
    }

    function deletePinDigit() {
      if (currentPinInput.length > 0) {
        currentPinInput = currentPinInput.slice(0, -1);
        updatePinDots();
      }
    }

    function clearPin() {
      currentPinInput = "";
      updatePinDots();
    }

    function updatePinDots() {
      const dots = document.querySelectorAll('#pin-dots .pin-dot');
      dots.forEach((dot, index) => {
        if (index < currentPinInput.length) {
          dot.classList.remove('bg-transparent', 'border-zinc-700');
          dot.classList.add('bg-brand-sky', 'border-brand-sky', 'shadow-sm', 'shadow-sky-500');
        } else {
          dot.classList.remove('bg-brand-sky', 'border-brand-sky', 'shadow-sm', 'shadow-sky-500');
          dot.classList.add('bg-transparent', 'border-zinc-700');
        }
      });
    }

    function checkPin() {
      if (currentPinInput === PIN_CODE) {
        document.getElementById('pin-screen').classList.add('hidden');
        document.getElementById('app-container').classList.remove('hidden');
        syncData();
      } else {
        document.getElementById('pin-error').classList.remove('hidden');
        clearPin();
        setTimeout(() => {
          document.getElementById('pin-error').classList.add('hidden');
        }, 2000);
      }
    }

    // JSONBin Sync
    async function syncData() {
      const statusEl = document.getElementById('sync-status');
      statusEl.className = "w-2.5 h-2.5 rounded-full bg-brand-amber animate-pulse";

      if (!CONFIG_BIN_ID || CONFIG_BIN_ID.includes("DEINE_BIN_ID")) {
        const local = localStorage.getItem('inventory_backup');
        if (local) inventoryData = JSON.parse(local);
        renderInventory();
        renderQuickSelect();
        statusEl.className = "w-2.5 h-2.5 rounded-full bg-brand-sky";
        return;
      }

      try {
        const response = await fetch(`https://api.jsonbin.io/v3/b/${CONFIG_BIN_ID}/latest`, {
          headers: { 'X-Master-Key': CONFIG_MASTER_KEY }
        });

        if (!response.ok) throw new Error("Fehler beim Laden");

        const result = await response.json();
        if (result.record && result.record.inventory) {
          inventoryData = result.record.inventory;
        } else if (result.record && typeof result.record === 'object') {
          inventoryData = result.record;
        } else {
          inventoryData = {};
        }

        localStorage.setItem('inventory_backup', JSON.stringify(inventoryData));
        statusEl.className = "w-2.5 h-2.5 rounded-full bg-brand-emerald";
      } catch (err) {
        statusEl.className = "w-2.5 h-2.5 rounded-full bg-brand-rose";
        const local = localStorage.getItem('inventory_backup');
        if (local) inventoryData = JSON.parse(local);
      }

      renderInventory();
      renderQuickSelect();
    }

    async function saveToCloud() {
      const statusEl = document.getElementById('sync-status');
      statusEl.className = "w-2.5 h-2.5 rounded-full bg-brand-amber animate-pulse";
      
      localStorage.setItem('inventory_backup', JSON.stringify(inventoryData));

      if (!CONFIG_BIN_ID || CONFIG_BIN_ID.includes("DEINE_BIN_ID")) {
        statusEl.className = "w-2.5 h-2.5 rounded-full bg-brand-sky";
        return;
      }

      try {
        const response = await fetch(`https://api.jsonbin.io/v3/b/${CONFIG_BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': CONFIG_MASTER_KEY
          },
          body: JSON.stringify({ inventory: inventoryData })
        });

        if (!response.ok) throw new Error("Fehler beim Speichern");
        statusEl.className = "w-2.5 h-2.5 rounded-full bg-brand-emerald";
      } catch (err) {
        statusEl.className = "w-2.5 h-2.5 rounded-full bg-brand-rose";
      }
    }

    // Render Bestandsübersicht (REINE ANZEIGE)
    function renderInventory() {
      const container = document.getElementById('inventory-list');
      const searchQuery = document.getElementById('search-input').value.toLowerCase();
      container.innerHTML = '';

      let totalLiters = 0;
      let totalItemsCount = 0;

      const itemsArray = Object.keys(inventoryData).map(ean => {
        const parsed = parseItem(inventoryData[ean]);
        return {
          ean: ean,
          brand: parsed.brand,
          variety: parsed.variety,
          volume: parsed.volume,
          quantity: parsed.stock
        };
      });

      // Alphabetisch sortieren
      itemsArray.sort((a, b) => a.brand.localeCompare(b.brand, 'de', { sensitivity: 'base' }));

      itemsArray.forEach(item => {
        const itemLiters = item.quantity * item.volume;
        totalLiters += itemLiters;
        totalItemsCount += item.quantity;

        const matchesSearch = item.brand.toLowerCase().includes(searchQuery) || 
                              item.variety.toLowerCase().includes(searchQuery) ||
                              item.ean.toLowerCase().includes(searchQuery);

        if (matchesSearch) {
          const card = document.createElement('div');
          card.className = "bg-brand-card p-3.5 rounded-xl border border-brand-border flex items-center justify-between";
          
          card.innerHTML = `
            <div>
              <h4 class="font-bold text-white text-base leading-tight">${item.brand}</h4>
              <p class="text-xs text-brand-sky font-medium mt-0.5">${item.variety} &bull; ${item.volume.toFixed(2)}L</p>
              <p class="text-[11px] text-zinc-500 mt-1">EAN: <span class="font-mono text-zinc-400">${item.ean}</span> &bull; Gesamt: <span class="text-zinc-300 font-semibold">${itemLiters.toFixed(2)} Liter</span></p>
            </div>
            
            <div class="text-right">
              <div class="text-xl font-extrabold ${item.quantity > 0 ? 'text-white' : 'text-zinc-600'}">
                ${item.quantity} <span class="text-xs font-normal text-zinc-500">Stk.</span>
              </div>
            </div>
          `;
          container.appendChild(card);
        }
      });

      document.getElementById('total-liters').innerHTML = `${totalLiters.toFixed(2)} <span class="text-sm font-normal text-zinc-400">Liter</span>`;
      document.getElementById('total-items').innerText = totalItemsCount;
    }

    function renderQuickSelect() {
      const select = document.getElementById('quick-select');
      select.innerHTML = '';

      const itemsArray = Object.keys(inventoryData).map(ean => {
        const parsed = parseItem(inventoryData[ean]);
        return {
          ean: ean,
          brand: parsed.brand,
          variety: parsed.variety,
          volume: parsed.volume,
          stock: parsed.stock
        };
      });

      itemsArray.sort((a, b) => a.brand.localeCompare(b.brand, 'de', { sensitivity: 'base' }));

      itemsArray.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.ean;
        opt.textContent = `${item.brand} - ${item.variety} (${item.volume}L) [Stock: ${item.stock}]`;
        select.appendChild(opt);
      });
    }

    // Buchen & Mengeneingabe
    function setAmount(val) {
      document.getElementById('booking-amount').value = val;
    }

    function executeBooking(direction) {
      const ean = document.getElementById('quick-select').value;
      const amountInput = parseInt(document.getElementById('booking-amount').value) || 1;
      
      if (!ean || !inventoryData[ean]) return;

      const delta = direction * amountInput;
      const parsed = parseItem(inventoryData[ean]);
      const newStock = Math.max(0, parsed.stock + delta);

      if (inventoryData[ean].stock !== undefined) {
        inventoryData[ean].stock = newStock;
      } else if (inventoryData[ean].quantity !== undefined) {
        inventoryData[ean].quantity = newStock;
      } else {
        inventoryData[ean].stock = newStock;
      }

      renderInventory();
      renderQuickSelect();
      saveToCloud();

      // Reset
      document.getElementById('booking-amount').value = 1;
    }

    function addNewItem() {
      const ean = document.getElementById('new-ean').value.trim();
      const brand = document.getElementById('new-brand').value.trim();
      const variety = document.getElementById('new-variety').value.trim();
      const volume = parseFloat(document.getElementById('new-volume').value);

      if (!ean || !brand || !variety || isNaN(volume)) {
        alert("Bitte fülle alle Felder inklusive EAN-Nummer aus!");
        return;
      }

      inventoryData[ean] = {
        brand: brand,
        sort: variety,
        volume: volume,
        stock: 0
      };

      document.getElementById('new-ean').value = '';
      document.getElementById('new-brand').value = '';
      document.getElementById('new-variety').value = '';
      document.getElementById('new-volume').value = '';

      renderInventory();
      renderQuickSelect();
      saveToCloud();

      switchTab('inventory');
    }

    function switchTab(tab) {
      const invTab = document.getElementById('tab-inventory');
      const quickTab = document.getElementById('tab-quick');
      const invBtn = document.getElementById('tab-inventory-btn');
      const quickBtn = document.getElementById('tab-quick-btn');

      if (tab === 'inventory') {
        invTab.classList.remove('hidden');
        quickTab.classList.add('hidden');
        invBtn.className = "py-2 text-sm font-medium rounded-lg transition-all bg-brand-sky text-zinc-950 font-bold shadow-sm";
        quickBtn.className = "py-2 text-sm font-medium rounded-lg transition-all text-zinc-400 hover:text-white";
      } else {
        invTab.classList.add('hidden');
        quickTab.classList.remove('hidden');
        quickBtn.className = "py-2 text-sm font-medium rounded-lg transition-all bg-brand-sky text-zinc-950 font-bold shadow-sm";
        invBtn.className = "py-2 text-sm font-medium rounded-lg transition-all text-zinc-400 hover:text-white";
      }
    }
  </script>
</body>
</html>
